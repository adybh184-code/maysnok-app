<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة إدارة Maysnok</title>

<style>
*{
  box-sizing:border-box;
}
body{
  margin:0;
  font-family:Arial, sans-serif;
  background:#f4f7fb;
  color:#1f2937;
}
.header{
  background:#2563eb;
  color:white;
  padding:25px;
}
.header h1{
  margin:0;
}
.header p{
  margin:8px 0 0;
}
.container{
  max-width:1100px;
  margin:30px auto;
  padding:15px;
}
.stats{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:15px;
  margin-bottom:25px;
}
.stat{
  background:white;
  padding:22px;
  border-radius:16px;
  box-shadow:0 3px 15px #00000010;
}
.stat h3{
  margin:0 0 10px;
  color:#6b7280;
}
.stat strong{
  font-size:30px;
}
.menu{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:18px;
}
.btn{
  background:white;
  border:none;
  padding:28px 15px;
  border-radius:18px;
  font-size:18px;
  font-weight:bold;
  cursor:pointer;
  box-shadow:0 3px 15px #00000010;
}
.btn:hover{
  background:#2563eb;
  color:white;
}
.add{
  background:#16a34a;
  color:white;
}
.stop{
  background:#ef4444;
  color:white;
}
</style>
</head>

<body>

<div class="header">
  <h1>⚙️ لوحة إدارة Maysnok</h1>
  <p>مرحبا بك — إدارة المنصة</p>
</div>

<div class="container">

  <div class="stats">

    <div class="stat">
      <h3>👷 المهنيون</h3>
      <strong>4</strong>
    </div>

    <div class="stat">
      <h3>👥 الزبناء</h3>
      <strong>0</strong>
    </div>

    <div class="stat">
      <h3>📋 الطلبات</h3>
      <strong>0</strong>
    </div>

    <div class="stat">
      <h3>💳 الاشتراكات</h3>
      <strong>0</strong>
    </div>

  </div>

  <div class="menu">

<button class="btn" id="showArtisans">👷 المهنيون</button>

    <button class="btn">👥 الزبناء</button>

    <button class="btn">📋 الطلبات</button>

    <button class="btn">💳 الاشتراكات</button>

    <button class="btn">📊 الإحصائيات</button>

    <button class="btn add">➕ إضافة مهني</button>

    <button class="btn stop">⛔ حذف / توقيف مهني</button>

  </div>

</div>  
 </div>
  <div id="addForm" style="display:none; background:white; padding:20px; margin:20px; border-radius:15px;">
    <h2>إضافة مهني</h2>

    <input id="name" placeholder="اسم المهني"><br><br>
    <input id="job" placeholder="المهنة"><br><br>
    <input id="city" placeholder="المدينة"><br><br>
    <input id="phone" placeholder="رقم الهاتف"><br><br>

    <button id="saveArtisan">حفظ المهني</button>
</div>


<script>
document.querySelector('.add').onclick = function () {
    document.getElementById('addForm').style.display = 'block';
};

document.getElementById('saveArtisan').onclick = function () {
    let name = document.getElementById('name').value;
    let job = document.getElementById('job').value;
    let city = document.getElementById('city').value;
    let phone = document.getElementById('phone').value;

    if (!name || !job || !city || !phone) {
        alert('عمر جميع المعلومات');
        return;
    }
let artisans = JSON.parse(localStorage.getItem('artisans') || '[]');

artisans.push({
    name: name,
    job: job,
    city: city,
    phone: phone
});

localStorage.setItem('artisans', JSON.stringify(artisans));

let list = document.getElementById('artisanList');

if (!list) {
    list = document.createElement('div');
    list.id = 'artisanList';
    list.style.padding = '20px';
    list.style.margin = '20px';
    list.style.background = 'white';
    list.style.borderRadius = '15px';
    document.getElementById('addForm').after(list);
}

list.innerHTML += `
    <div style="padding:15px;border-bottom:1px solid #ddd">
        👷 <b>${name}</b><br>
        ${job} — ${city}<br>
        📞 ${phone}
    </div>
`;
    alert('تم حفظ المهني: ' + name);  
      document.getElementById('addForm').style.display = 'none';
};
</script>   
</body>
</html>
