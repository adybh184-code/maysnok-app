<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة إدارة Maysnok</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f4f7fb;
}
header{
    background:#1264d8;
    color:white;
    padding:22px;
    text-align:center;
}
.container{
    max-width:900px;
    margin:auto;
    padding:20px;
}
.stats{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:12px;
}
.card{
    background:white;
    padding:18px;
    border-radius:15px;
    text-align:center;
}
.card strong{
    font-size:30px;
    color:#1264d8;
}
.menu{
    margin-top:20px;
    display:grid;
    gap:10px;
}
button{
    border:0;
    padding:15px;
    border-radius:12px;
    font-size:17px;
    cursor:pointer;
}
.btn{
    background:white;
}
.add{
    background:#16a34a;
    color:white;
}
.stop{
    background:#dc2626;
    color:white;
}
#addForm,#artisanList{
    display:none;
    background:white;
    padding:20px;
    margin-top:20px;
    border-radius:15px;
}
input{
    width:95%;
    padding:12px;
    margin:6px 0;
    border:1px solid #ddd;
    border-radius:8px;
}
.artisan{
    padding:15px 0;
    border-bottom:1px solid #ddd;
}
.delete{
    background:#dc2626;
    color:white;
    padding:8px 12px;
    margin-top:8px;
}
</style>
</head>

<body>

<header>
    <h1>Maysnok</h1>
    <div>لوحة الإدارة</div>
</header>

<div class="container">

<div class="stats">
    <div class="card">
        <div>👷 المهنيون</div>
        <strong id="artisanCount">0</strong>
    </div>

    <div class="card">
        <div>👥 الزبناء</div>
        <strong>0</strong>
    </div>

    <div class="card">
        <div>📋 الطلبات</div>
        <strong>0</strong>
    </div>

    <div class="card">
        <div>💳 الاشتراكات</div>
        <strong>0</strong>
    </div>
</div>

<div class="menu">
    <button class="btn" id="showArtisans">👷 المهنيون</button>
    <button class="btn">👥 الزبناء</button>
    <button class="btn">📋 الطلبات</button>
    <button class="btn">💳 الاشتراكات</button>
    <button class="btn">📊 الإحصائيات</button>
    <button class="add" id="addButton">➕ إضافة مهني</button>
</div>

<div id="addForm">
    <h2>➕ إضافة مهني</h2>

    <input id="name" placeholder="اسم المهني">
    <input id="job" placeholder="المهنة">
    <input id="city" placeholder="المدينة">
    <input id="phone" placeholder="رقم الهاتف">

    <br><br>
    <button class="add" id="saveArtisan">💾 حفظ المهني</button>
</div>

<div id="artisanList"></div>

</div>

<script>
function getArtisans(){
    return JSON.parse(localStorage.getItem('artisans') || '[]');
}

function updateCount(){
    document.getElementById('artisanCount').textContent = getArtisans().length;
}

function showArtisans(){
    let artisans = getArtisans();
    let list = document.getElementById('artisanList');

    list.innerHTML = '<h2>👷 لائحة المهنيين</h2>';

    if(artisans.length === 0){
        list.innerHTML += '<p>لا يوجد مهنيون مضافون بعد.</p>';
    }

    artisans.forEach(function(a,index){
        list.innerHTML += `
        <div class="artisan">
            👷 <strong>${a.name}</strong><br>
            🛠️ ${a.job}<br>
            📍 ${a.city}<br>
            📞 ${a.phone}<br>
            <button class="delete" onclick="deleteArtisan(${index})">
                🗑️ حذف
            </button>
        </div>`;
    });

    list.style.display='block';
    list.scrollIntoView({behavior:'smooth'});
}

function deleteArtisan(index){
    let artisans = getArtisans();

    if(confirm('هل تريد حذف هذا المهني؟')){
        artisans.splice(index,1);
        localStorage.setItem('artisans',JSON.stringify(artisans));
        updateCount();
        showArtisans();
    }
}

document.getElementById('addButton').onclick=function(){
    document.getElementById('addForm').style.display='block';
    document.getElementById('addForm').scrollIntoView({behavior:'smooth'});
};

document.getElementById('showArtisans').onclick=showArtisans;

document.getElementById('saveArtisan').onclick=function(){

    let name=document.getElementById('name').value.trim();
    let job=document.getElementById('job').value.trim();
    let city=document.getElementById('city').value.trim();
    let phone=document.getElementById('phone').value.trim();

    if(!name || !job || !city || !phone){
        alert('عمر جميع المعلومات');
        return;
    }

    let artisans=getArtisans();

    artisans.push({
        name:name,
        job:job,
        city:city,
        phone:phone
    });

    localStorage.setItem('artisans',JSON.stringify(artisans));

    document.getElementById('name').value='';
    document.getElementById('job').value='';
    document.getElementById('city').value='';
    document.getElementById('phone').value='';

    document.getElementById('addForm').style.display='none';

    updateCount();
    showArtisans();

    alert('تم حفظ المهني بنجاح');
};

updateCount();
</script>

</body>
</html>
